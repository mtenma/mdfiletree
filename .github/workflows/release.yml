name: release

# v0.1.0 のようなタグを打つと、両プラットフォームを組み立てて
# GitHub のリリースに実行ファイルを添える。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel と Apple Silicon の両方で動くように universal で作る。
          # 添えるファイルは OS ごとに違うので、ここで指定する
          # （両方まとめて書くと、作られない側のパターンで弾かれる）
          - label: macOS (Universal)
            os: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: ビルド
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: リリースに添える
        uses: softprops/action-gh-release@v2
        with:
          # 両ジョブが同じタグのリリースに追記していく
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
          generate_release_notes: true
