[package]
name = "mdfiletree"
version = "0.1.0"
description = "表の再現性を重視した Markdown リーダー"
authors = ["mdfiletree"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mdfiletree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
base64 = "0.23"

# macOS は同じアプリが二重に起動しないので不要。
# Windows / Linux はファイルを開くたびに別プロセスが立ち上がるため、
# 2 つ目以降のプロセスから最初のプロセスへパスを渡すのに使う。
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# std::fs::canonicalize は Windows で `\\?\C:\...` を返す。
# そのまま画面に出すと読みにくく、パス比較も合わなくなるため、
# 素直な形に直してくれる dunce を通す。
[target.'cfg(windows)'.dependencies]
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
